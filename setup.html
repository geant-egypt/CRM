<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Géant setup</title>
<style>body{font:16px Tahoma,sans-serif;max-width:560px;margin:20px auto;padding:0 14px}input{width:100%;padding:8px;margin:2px 0 10px;box-sizing:border-box}button{padding:10px 18px;font-size:16px}pre{background:#f3f3f3;padding:10px;white-space:pre-wrap}</style></head><body>
<h2>إنشاء حسابات الموظفين (مرة واحدة)</h2>
<p>اكتب كلمة سر جديدة (6 حروف على الأقل) لكل مستخدم. اللي تسيبه فاضي هيتخطّى.</p>
<div id="rows">جاري التحميل...</div><button id="go">إنشاء الحسابات</button><pre id="log"></pre>
<script>
const K="AIzaSyDXFZjntvRJdZ9ppDlLO1a-1UQ70gbLyvA",DB="https://geant-cs-crm-default-rtdb.europe-west1.firebasedatabase.app";
let L=[{u:"owner",r:"owner"},{u:"karim",r:"sup"},{u:"tamer",r:"sup"},{u:"abdullah",r:"agent"},{u:"amr",r:"agent"},{u:"ahmed",r:"agent"}];
const lg=t=>log.textContent+=t+"\n";
(async()=>{try{const r=await(await fetch(DB+"/d/nu.json")).json();JSON.parse(r||"[]").forEach(x=>L.push({u:x.u,r:x.r}))}catch(e){}
rows.innerHTML=L.map((x,i)=>`<label>${x.u} (${x.r})<input id="p${i}" type="text" autocomplete="off"></label>`).join("")})();
go.onclick=async()=>{for(let i=0;i<L.length;i++){const p=document.getElementById("p"+i).value,x=L[i];if(!p)continue;
 if(p.length<6){lg("✗ "+x.u+": أقل من 6 حروف");continue}
 try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+K,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:x.u+"@geant-cs.app",password:p,returnSecureToken:false})}),j=await r.json();
 if(!r.ok)throw j.error.message;
 await fetch(DB+"/roles/"+j.localId+".json",{method:"PUT",body:JSON.stringify({u:x.u,r:x.r})});lg("✓ "+x.u)}catch(e){lg("✗ "+x.u+": "+e)}}lg("خلصنا.")};
</script></body></html>
