nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{border:0;background:none;color:#ffd9dc;font:600 15px Cairo,Tahoma,sans-serif;padding:6px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--wht);color:var(--red)}
.me{font-size:13px}
main{max-width:1020px;margin:auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.btn{background:var(--red);color:var(--wht);border:0;padding:7px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.w{background:var(--wht);color:var(--red)}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.gr{background:var(--grn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{background:var(--card);border-radius:10px;padding:12px 14px;border-inline-start:6px solid var(--c,var(--red))}
.st b{display:block;font-size:30px;line-height:1.2}.st span{color:var(--mut);font-size:13px}
.box{background:var(--card);border-radius:10px;padding:14px;margin-bottom:14px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.tk .t{flex:1;min-width:180px;font-weight:600}.tk small{color:var(--mut);display:block;font-weight:400}
.tag{font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.new{--c:var(--red)}.prog{--c:var(--amb)}.done{--c:var(--grn)}.hi{--c:var(--red)}.mid{--c:var(--amb)}.lo{--c:var(--mut)}

.ins{margin:0;padding-inline-start:18px}.ins li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}

.nv a{border-color:var(--grn);color:var(--grn)}

.me{font-size:13px;font-weight:600;padding:0 8px}
/* Géant brand language: white base, bold red wordmark, green swoosh, orange spark, round friendly shapes */

html,body{background:var(--bg)}

.me{color:var(--ink)}

.nv{padding-top:14px}

.bar{height:12px;border-radius:99px}

.md h2 .tno{font-size:14px}
</style>

 <div class="cols"><div class="box"><h3>${L("dist")}</h3>${bars(sts.map(k=>[k,R.filter(x=>x.o.s==k).length]),SL)}</div><div class="box"><h3>${TL("byEmp")}</h3>${bars(grp(o=>o.ag),nm)}</div>
 <div class="box"><h3>${TL("branch")}</h3>${bars(grp(o=>(o.f?o.f.branch:o.br)||"—"),x=>x)}</div>${rt=="tk"?`<div class="box"><h3>${TL("byCh")}</h3>${bars(grp(o=>o.ch),CHL)}</div><div class="box"><h3>${TL("byPr")}</h3>${bars(grp(o=>o.pr),L)}</div>`:""}</div>
 <div class="box"><div class="scroll"><table><tr>${H.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${R.slice(0,300).map(x=>`<tr>${x.c.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")||`<tr><td>${TL("empty")}</td></tr>`}</table></div></div>`;

async function exportCsv(){const{H,R}=repRows(),q2=v=>`"${String(v).replace(/"/g,'""')}"`,dl=window.claude?await window.claude.use("downloads"):null;
 if(!dl){const csv="\ufeff"+[H,...R.map(x=>x.c)].map(r=>r.map(q2).join(",")).join("\r\n"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download=`geant-${rt}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
 try{await dl.save({filename:`geant-${rt}-${new Date().toISOString().slice(0,10)}.csv`,data:"\ufeff"+[H,...R.map(x=>x.c)].map(r=>r.map(q2).join(",")).join("\r\n")})}catch(e){}}

function TL(k){return X[lang][k]||L(k)}function SL(k){return X[lang]["s_"+k]||L(k)}function CHL(c){return X[lang]["ch_"+c]||""}
const SC={rep:"new",ord:"prog",av:"done",res:"new",rdy:"prog",del:"done",pend:"new",dn:"done",rcv:"done",new:"new",prog:"prog",done:"done"};
const MOD={req:{f:[["cust","cust"],["branch","br"],["subject","text"],["det","area"]],st:["new","prog","done"],main:"subject"},
short:{f:[["product","text"],["section","text"],["resp","text"],["branch","br"],["qty","num"],["det","area"]],need:["product","section","resp"],st:["rep","ord","av"],main:"product",shared:1},
resv:{f:[["cust","cust"],["product","text"],["qty","num"],["branch","br"],["due","date"]],st:["res","rdy","del"],main:"product"},
fu:{f:[["cust","cust"],["branch","br"],["subject","text"],["due","date"]],st:["pend","dn"],main:"subject"},
ho:{f:[["to","agent"],["branch","br"],["subject","text"],["det","area"]],st:["pend","rcv"],main:"subject",shared:1}};
const fv=(r,x)=>{const v=r.f[x[0]];return x[1]=="cust"?cu(v).name:x[1]=="agent"?nm(v):v};
const mrow=(r,M)=>`<div class="tk" data-m="${r.id}"><div class="t">${esc(r.f[M.main])}<small>${M.f.filter(x=>x[0]!=M.main&&x[1]!="area"&&r.f[x[0]]).map(x=>esc(TL(x[0]))+": "+esc(fv(r,x))).join(" • ")} • ${TL("by")}: ${nm(r.ag)} • ${fd(r.d)}</small></div><span class="tag ${SC[r.s]}">${SL(r.s)}</span></div>`;
function mod(a){const M=MOD[view];let fq="",fst="";
 a.innerHTML=`<div class="row"><input id="q" placeholder="${L("search")}"><select id="fs"><option value="">${L("allS")}</option>${M.st.map(k=>`<option value="${k}">${SL(k)}</option>`).join("")}</select><button class="btn w" id="nr">+ ${TL("add")}</button></div><div class="box" id="lst"></div>`;
 const f=()=>{const l=S.m[view].filter(r=>(M.shared||sup()||r.ag==me.u)&&(!fst||r.s==fst)&&JSON.stringify(r.f).includes(fq)).sort((x,y)=>y.d-x.d);
  $("lst").innerHTML=l.map(r=>mrow(r,M)).join("")||`<div class="empty">${TL("empty")}</div>`;$("lst").querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>mView(e.dataset.m))};
 $("q").oninput=e=>{fq=e.target.value;f()};$("fs").onchange=e=>{fst=e.target.value;f()};$("nr").onclick=mForm;f()}
function mForm(){const M=MOD[view];
 const inp=([i,t])=>`<label>${TL(i)}${t=="cust"?`<input id="f_${i}" placeholder="${L("name")}"></label><label>${L("phone")}<input id="f_${i}_p" inputmode="tel">`:t=="br"?sel("f_"+i,[["",TL("pickB")],...BR.map(b=>[b,b])],""):t=="agent"?sel("f_"+i,AG.map(g=>[g,nm(g)]),""):t=="area"?`<textarea id="f_${i}" rows="3"></textarea>`:`<input id="f_${i}" type="${t=="num"?"number":t=="date"?"date":"text"}">`}</label>`;
 open(`<h2>${TL(view)}</h2><div class="f" style="margin-top:10px">${M.f.map(inp).join("")}<div class="row" style="margin:0"><button class="btn g" id="x">${L("cancel")}</button><button class="btn" id="sv">${L("save")}</button></div></div>`);
 $("x").onclick=close;$("sv").onclick=()=>{const f={};M.f.forEach(([i])=>f[i]=$("f_"+i).value.trim());
  const nd=[...(M.need||[M.main])];if(M.f.some(x=>x[0]=="cust"))nd.push("cust");if(M.f.some(x=>x[0]=="branch"))nd.push("branch");const bd=nd.find(i=>!f[i]);if(bd){$("f_"+bd).focus();$("f_"+bd).style.borderColor="var(--red)";return}if("cust" in f)f.cust=getCust(f.cust,$("f_cust_p").value);
  S.m[view].push({id:S.n++,ag:me.u,d:Date.now(),s:M.st[0],f,notes:[]});save();close();render()}}
function mView(id){const M=MOD[view],r=S.m[view].find(x=>x.id==id);
 open(`<h2>${esc(r.f[M.main])}</h2><small style="color:var(--mut)">${nm(r.ag)} • ${fd(r.d)}</small><div class="f" style="margin-top:10px">${M.f.filter(x=>x[0]!=M.main).map(x=>`<div><small style="color:var(--mut)">${TL(x[0])}</small><div>${esc(fv(r,x))||"—"}</div></div>`).join("")}
 <label>${L("status")}${sel("s",M.st.map(k=>[k,SL(k)]),r.s)}</label><div class="tl">${r.notes.map(n=>`<p>${esc(n.t)}<small>${fd(n.d)}</small></p>`).join("")||`<small>${L("noNote")}</small>`}</div>
 <label>${L("addNote")}<textarea id="nt2" rows="2"></textarea></label><div class="row" style="margin:0"><button class="btn g" id="x">${L("close")}</button><button class="btn gr" id="sv">${L("save")}</button></div></div>`);
 $("x").onclick=close;$("sv").onclick=()=>{r.s=$("s").value;const v=$("nt2").value.trim();if(v)r.notes.push({t:v,d:Date.now()});save();close();render()}}
function ext(a){a.innerHTML=`<div class="box"><h3>${TL(view)}</h3><p>${TL(view+"d")}</p><a class="btn gr" style="display:inline-block;text-decoration:none" href="${LK[view]}" target="_blank" rel="noopener">${TL("openL")}</a><p style="color:var(--mut);font-size:13px;direction:ltr;text-align:start">${LK[view]}</p></div>`}
function extra(l){const ch=CH.map(c=>[c,l.filter(t=>t.ch==c).length]),mx=Math.max(1,...ch.map(x=>x[1]));
 const cnt=(k,s)=>S.m[k].filter(r=>(MOD[k].shared||sup()||r.ag==me.u)&&s.includes(r.s)).length;
 return `<div class="cols"><div class="box"><h3>${TL("byCh")}</h3>${ch.map(([c,n])=>`<div class="row" style="margin:3px 0"><span style="flex:0 0 90px">${CHL(c)}</span><div class="bar" style="flex:1"><i style="width:${n/mx*100}%"></i></div><span style="flex:0 0 24px">${n}</span></div>`).join("")}</div>
 <div class="box"><h3>${TL("pending")}</h3><div class="stats" style="grid-template-columns:repeat(2,1fr);margin:0">${[["req",["new","prog"]],["short",["rep","ord"]],["resv",["res","rdy"]],["fu",["pend"]],["ho",["pend"]]].map(([k,s])=>`<div class="st" style="--c:var(--grn)"><b>${cnt(k,s)}</b><span>${TL(k)}</span></div>`).join("")}</div></div></div>`}
render();
