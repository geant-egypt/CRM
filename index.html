<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--red:#d7202c;--red2:#b5121e;--bg:#cf1f2a;--card:#fff;--ink:#241417;--mut:#6f5d60;--line:#ecdcde;--grn:#2f8a22;--wht:#fff;--amb:#d97400}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Cairo,Tahoma,sans-serif;min-height:100vh}
header{background:var(--red2);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:4px solid var(--grn)}
.top{max-width:1020px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--wht)}
.logo{font-weight:800;font-size:22px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{border:0;background:none;color:#ffd9dc;font:600 15px Cairo,Tahoma,sans-serif;padding:6px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--wht);color:var(--red)}
.me{font-size:13px}
main{max-width:1020px;margin:auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.btn{background:var(--red);color:var(--wht);border:0;padding:7px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.w{background:var(--wht);color:var(--red)}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}.btn.gr{background:var(--grn)}
.btn.s{padding:3px 12px;font-size:13px}
input,select,textarea{background:var(--wht);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{background:var(--card);border-radius:10px;padding:12px 14px;border-inline-start:6px solid var(--c,var(--red))}
.st b{display:block;font-size:30px;line-height:1.2}.st span{color:var(--mut);font-size:13px}
.box{background:var(--card);border-radius:10px;padding:14px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:16px;color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar i{display:block;background:var(--c,var(--red))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>*{flex:1;min-width:130px}.row .btn{flex:0 0 auto}
.tk{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.tk:last-child{border:0}.tk:hover{background:#fbf3f3}
.tk .t{flex:1;min-width:180px;font-weight:600}.tk small{color:var(--mut);display:block;font-weight:400}
.tag{font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.new{--c:var(--red)}.prog{--c:var(--amb)}.done{--c:var(--grn)}.hi{--c:var(--red)}.mid{--c:var(--amb)}.lo{--c:var(--mut)}
.trend{display:flex;align-items:flex-end;gap:8px;height:110px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.trend p{margin:0;display:flex;gap:2px;align-items:flex-end;flex:1;width:100%}
.trend i{flex:1;border-radius:3px 3px 0 0;background:var(--red);min-height:2px}.trend i.g{background:var(--grn)}
.ins{margin:0;padding-inline-start:18px}.ins li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.ov.on{display:flex}
.md{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:18px}
.md h2{margin:0 0 4px;font-size:18px;color:var(--red)}
.f{display:grid;gap:10px}.f label{font-size:13px;color:var(--mut);display:grid;gap:3px}
.tl{border-inline-start:3px solid var(--grn);padding-inline-start:12px;margin:8px 0}
.tl p{margin:0 0 8px}.tl small{color:var(--mut);display:block}
.empty{color:var(--mut);padding:16px;text-align:center}
.lg{max-width:380px;margin:8vh auto 0}
.lg h1{margin:0 0 4px;color:var(--red);font-size:26px}
.err{color:var(--red);font-weight:600;min-height:24px}
.hint{font-size:12px;color:var(--mut);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.lt{text-align:end;padding:12px 16px;max-width:1020px;margin:auto}
header{position:relative;min-height:70px}
.hl{position:absolute;right:10px;top:4px;height:62px;width:62px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;z-index:2}
.top{padding-right:84px}
.top{padding:4px 12px;gap:6px}.logo{font-size:17px}
nav{flex:1 1 100%;order:5;display:grid;grid-template-columns:repeat(6,max-content);gap:2px 6px;overflow-x:auto;scrollbar-width:none}
nav button,nav a{font:600 13px Cairo,Tahoma,sans-serif;padding:3px 10px;white-space:nowrap;color:#ffd9dc;text-decoration:none;border-radius:8px}
nav button.on{color:var(--red)}nav a:hover{background:#fff3}
.btn.s{padding:2px 9px;font-size:12px}.me{font-size:12px}
main{padding:10px 16px}.row{margin-bottom:8px;gap:6px}.row>*{min-width:110px}
input,select,textarea{padding:4px 8px;font-size:14px}
.box,.st{border:1px solid var(--line);box-shadow:0 1px 3px #0001}.st{border-inline-start:6px solid var(--c,var(--red))}
main .btn.w{background:var(--red);color:#fff}
.hw{max-width:1020px;margin:auto;display:flex;align-items:center;gap:4px;padding:0 10px 0 0}
.top{flex:1;min-width:0;max-width:none;margin:0;padding:4px 12px}
.hl{position:static;flex:none;height:60px;width:60px;border-radius:8px;background:#fff;padding:2px;object-fit:contain}
header{min-height:0}
.nv{display:flex;flex-wrap:wrap;gap:6px;max-width:1020px;margin:0 auto;padding:10px 16px 2px;overflow:visible;flex:none;order:0}
.nv button,.nv a{font:600 13px Cairo,Tahoma,sans-serif;padding:5px 14px;border-radius:99px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;text-decoration:none;white-space:nowrap}
.nv button.on{background:var(--red);color:#fff}
.nv a{border-color:var(--grn);color:var(--grn)}
.nv button:hover,.nv a:hover{background:#fdecee}.nv button.on:hover{background:var(--red)}
.me{font-size:13px;font-weight:600;padding:0 8px}
/* Géant brand language: white base, bold red wordmark, green swoosh, orange spark, round friendly shapes */
:root{color-scheme:light;--bg:#faf6f3;--amb:#f08a1c;--line:#f0e4e0}
html,body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:10}
header{background:#fff;border-bottom:5px solid var(--grn);border-radius:0 0 50% 50%/0 0 26px 26px;box-shadow:0 8px 20px #d7202c18;padding-bottom:6px}
header .top{color:var(--ink)}
.logo{color:var(--red);font-weight:800;font-size:24px;letter-spacing:.2px}
.me{color:var(--ink)}
header .btn.w{background:#fff;color:var(--red);border:1.5px solid var(--red)}
header .btn.w:hover{background:var(--red);color:#fff}
.hl{height:68px;width:68px;background:none;padding:0;border-radius:0}
.nv{padding-top:14px}
.nv button,.nv a{font-size:14px;padding:6px 18px;border-width:1.5px;transition:background .15s,color .15s}
.nv button.on{box-shadow:0 3px 10px #d7202c40}
.nv a:hover{background:#eaf5e7}
.btn{border-radius:99px;padding:7px 22px;box-shadow:0 2px 6px #0000001a}
.btn.g{box-shadow:none}
input,select,textarea{border-radius:12px;border:1.5px solid var(--line)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--grn);box-shadow:0 0 0 3px #2f8a2226}
.box,.st{border:0;border-radius:18px;box-shadow:0 2px 12px #5a2a2414}
.st{border-inline-start:0;border-top:5px solid var(--c,var(--red))}
.st b{color:var(--c,var(--red));font-weight:800;font-size:32px}
.box h3{color:var(--red);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.box h3::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--amb);flex:none}
.tk:hover{background:#fff4f2;border-radius:12px}
.tag{background:color-mix(in srgb,var(--c) 10%,#fff);border-width:1.5px}
.bar{height:12px;border-radius:99px}
.bar i{background:linear-gradient(90deg,var(--red),var(--amb))}
.trend i{border-radius:6px 6px 0 0}
.md{border-radius:22px;border-top:6px solid var(--grn);box-shadow:0 12px 40px #0004}
.md h2{font-weight:800}
.lg{border-radius:26px;border-top:6px solid var(--grn);text-align:center;padding:22px 20px}
.lg .f,.lg p{text-align:start}
.lg h1{font-size:36px;font-weight:800}
.tno{display:inline-block;background:var(--red);color:#fff;font:800 12px/1.4 Cairo,Tahoma,sans-serif;padding:1px 10px;border-radius:99px;margin-inline-end:8px;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate;vertical-align:middle}
.md h2 .tno{font-size:14px}
.gsep{height:5px;width:100%;background:var(--grn);margin-top:12px;box-shadow:0 -6px 16px #2f8a2218}
/* header + tabs always on the left */
header .hw{direction:ltr;padding:0 10px}
header .top{justify-content:flex-start;padding-right:12px}
.nv{direction:ltr;justify-content:flex-start}
.lt{text-align:left}
/* side menu: left, under the logo, vertical */
.shell{display:flex;direction:ltr;align-items:flex-start;gap:14px;max-width:1020px;margin:0 auto;padding:0 10px}
.shell .nv{flex-direction:column;flex-wrap:nowrap;flex:none;width:176px;max-width:none;margin:0;padding:14px 0 10px;gap:6px;position:sticky;top:10px}
.shell .nv button,.shell .nv a{display:block;width:100%;text-align:left;border-radius:14px}
.shell main{flex:1;min-width:0;max-width:none;margin:0;padding:10px 0}
@media(max-width:640px){.shell{flex-direction:column;gap:0}.shell .nv{flex-direction:row;flex-wrap:wrap;width:100%;position:static}.shell .nv button,.shell .nv a{width:auto}.shell main{width:100%}}
.gl{display:inline-flex;align-items:center;justify-content:center}
.pend-note{color:var(--amb);font-weight:600;margin:6px 0 0}
.chg{display:grid;gap:2px;margin:8px 0;padding:8px 10px;background:#fbf3f3;border-radius:12px;font-size:14px}
.chg s{color:var(--mut);margin-inline-end:8px}.chg b{color:var(--grn)}

/* ===== v4: header left, bigger logo, mobile app shell, personal alerts ===== */
header .hw{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px}
header .top.hb{flex:1;min-width:0;justify-content:flex-start;flex-wrap:nowrap;padding:4px 0;gap:8px}
header .br{display:flex;align-items:center;gap:10px;flex:none}
header .top.hb{justify-content:flex-end}
.hl{height:106px;width:106px}
.bn{display:none}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.mg button,.mg a{font:600 14px Cairo,Tahoma,sans-serif;padding:12px 10px;border-radius:14px;border:1.5px solid var(--red);background:#fff;color:var(--red);text-align:center;text-decoration:none}
.mg a{border-color:var(--grn);color:var(--grn)}.mg button.on{background:var(--red);color:#fff}
.pnb{justify-content:center;margin:16px 0 0}
.pnb .btn{flex:0 0 auto}
.pnr{cursor:default}.pnr:hover{background:none}
#pnbox{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:40;display:grid;gap:8px;max-width:440px;margin-inline:auto;pointer-events:none}
.pnc{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px #0004;border-inline-start:6px solid var(--amb)}
.pnc.alarm{border-inline-start-color:var(--red);animation:pnr .9s ease-in-out infinite alternate}
.pnc .pni{font-size:26px;line-height:1.2}.pnc .pnx{flex:1;min-width:0}.pnc small{color:var(--mut);display:block}
@keyframes pnr{to{box-shadow:0 10px 30px #0004,0 0 0 4px #d7202c44}}
@keyframes sh{from{transform:translateY(40px);opacity:.3}}
@media(prefers-reduced-motion:reduce){.pnc.alarm{animation:none}.md{animation:none!important}}
@media(max-width:640px){
 html{-webkit-tap-highlight-color:transparent}
 body{overscroll-behavior-y:none}
 header{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;border-radius:0 0 22px 22px/0 0 16px 16px;padding-bottom:2px}
 header .hw{padding:0 10px}
 .hl{height:62px;width:62px}.logo{font-size:19px}
 header .br{gap:6px}
 header .top.hb{gap:6px}
 header .btn.s{padding:5px 11px;font-size:12.5px;white-space:nowrap}
 .pfr{display:none}
 .shell{padding:0 12px}
 .shell .nv{display:none}
 .shell main{padding:12px 0 calc(96px + env(safe-area-inset-bottom,0px))}
 div.bn{display:flex;direction:ltr;position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;justify-content:center;background:none;border:0;box-shadow:none;padding:0;pointer-events:none}
 div.bn button{pointer-events:auto;flex:none;display:inline-flex;flex-direction:row;align-items:center;gap:10px;border:0;background:var(--red);color:#fff;font:700 16px Cairo,Tahoma,sans-serif;padding:0 28px;border-radius:99px;min-height:52px;cursor:pointer;box-shadow:0 8px 22px #0000004d,0 0 0 4px #ffffffd9}
 div.bn button:active{transform:scale(.96)}
 div.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
 .box,.st{border-radius:20px}
 .btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
 .btn.s{min-height:32px}
 input,select,textarea{font-size:16px;padding:9px 12px}
 .tk{padding:12px 6px}
 .ov{align-items:flex-end;padding:0}
 .md{max-width:none;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sh .22s ease-out}
 .lg{margin-top:4vh}
 .pnb .btn{flex:1 1 calc(50% - 8px)}
 #pnbox{left:6px;right:6px}
}
/* ===== Survey colour language: dark base, deep-red header, green line, dark cards ===== */
:root{color-scheme:dark;--bg:#1a1012;--card:#241418;--ink:#f6e9e9;--mut:#bfa7aa;--line:#4d2b31;--hdr1:#7a0a11;--hdr2:#a30e18}
html,body{background:var(--bg)}
body::before{background:var(--hdr1)}
header{background:linear-gradient(180deg,var(--hdr1),var(--hdr2));border-bottom:5px solid var(--grn);box-shadow:0 8px 24px #0006}
header .top,header .me{color:#fff}
header .btn.w{background:#fff;color:var(--red);border:1.5px solid #fff}
header .btn.w:hover{background:var(--grn);border-color:var(--grn);color:#fff}
.hl{background:#fff;border-radius:18px;box-shadow:0 8px 22px #0005}
.box>img,.lg img{border-radius:18px}
.box,.st{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--red);box-shadow:0 6px 20px #0005}
.st{border-top:5px solid var(--c,var(--red))}
.md,.lg{background:var(--card);color:var(--ink)}
input,select,textarea{background:#1a1012;color:var(--ink);border:1.5px solid var(--line)}
input::placeholder,textarea::placeholder{color:#8f7a7d}
input[type=datetime-local],input[type=date],input[type=time]{color-scheme:dark}
.nv button,.nv a,.mg button,.mg a{background:var(--card);color:#f6dcdc}
.nv button.on,.mg button.on{background:var(--red);color:#fff}
.nv a,.mg a{color:#7ed36f}
.nv button:hover{background:#3a1a20}.nv a:hover{background:#18301a}
.nv button.on:hover{background:var(--red)}
.tk:hover{background:#2f1b21}
.tag{background:color-mix(in srgb,var(--c) 18%,var(--card))}
.chg{background:#2f1b21}
.box h3,.md h2,.lg h1{color:#ff5a64}
.pnc{background:var(--card);color:var(--ink)}
.bn{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px #0006}
.bn button.on{color:#ff5a64}.bn button.on .bi{background:#3a1a20}
.btn.g{color:var(--ink);border-color:var(--line)}
@media(max-width:640px){header{border-radius:0}}
/* sidebar: own scrollbar, independent of the page */
.shell .nv{top:calc(var(--hh,0px) + 10px);max-height:calc(100vh - var(--hh,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;padding:14px 8px 10px 4px;scrollbar-width:thin;scrollbar-color:var(--red) transparent}
.shell .nv::-webkit-scrollbar{width:6px}.shell .nv::-webkit-scrollbar-thumb{background:var(--red);border-radius:99px}.shell .nv::-webkit-scrollbar-track{background:transparent}

.pgt{max-width:1020px;margin:16px auto 0;padding:0 12px;text-align:center;color:#ff5a64;font-weight:800;font-size:26px;line-height:1.3}
@media(max-width:640px){.pgt{font-size:22px;margin-top:12px}}
/* Frozen header */
header{position:sticky!important;top:env(safe-area-inset-top,0px)!important;z-index:12!important}
/* Home clock */
.hclk{margin:0;color:var(--mut);font:inherit;font-variant-numeric:tabular-nums}

/* Cases feed / online */
.cs{cursor:default}.cs:hover{background:none!important}
.cs .late{color:var(--red);font-weight:700}
.pnc.case{border-inline-start-color:var(--red)}
.onl{max-width:1020px;margin:0 auto;padding:2px 14px 4px;font-size:12px;color:#ffd9dc;direction:ltr;text-align:right;white-space:normal;overflow:visible}
.onl .on1{display:block;line-height:1.5;margin:2px 0}
.onl .kk{margin-inline-start:8px;padding:1px 10px;font-size:11px}
.onl i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc5a;margin:0 5px 0 2px}

/* login page: white backdrop behind the card */
.lt .btn.w{border:1.5px solid var(--red)}
/* complaint validity: Valid = red, Not Valid = green */
.tag.vrd{--c:var(--red)}.tag.vgn{--c:var(--grn)}.tag.cx{--c:var(--mut)}
.tk.vrd{border-inline-start:5px solid var(--red);padding-inline-start:8px}
.tk.vgn{border-inline-start:5px solid var(--grn);padding-inline-start:8px}
.dtl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:12px 0;align-items:center}
.dtl>b{color:var(--mut);font-weight:600;font-size:13px}.dtl>span{word-break:break-word}
.btn.dl{color:var(--red)!important;border-color:var(--red)!important}
/* splash / loading */
#spl{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#spl.out{opacity:0;pointer-events:none}
#spl img{width:min(62vw,300px);height:auto;max-height:50vh;object-fit:contain;animation:spz 2s cubic-bezier(.22,.8,.3,1) forwards}
#spl .spt{font:700 17px/1 Cairo,Tahoma,sans-serif;color:var(--red);letter-spacing:.3px;display:flex;align-items:flex-end;gap:2px;direction:ltr}
#spl .spt b{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grn);margin-bottom:2px;animation:spd 1s infinite ease-in-out}

function bkAsk(){open(`<h2>${mgT("خروج من التطبيق","Close the app")}</h2><p style="margin:10px 0 0">${mgT("هل تريد إغلاق التطبيق؟","Do you want to close the app?")}</p><div class="row" style="margin:14px 0 0"><button class="btn" id="bky">${mgT("نعم","Yes")}</button><button class="btn g" id="bkn">${mgT("لا","No")}</button></div>`);
 $("bkn").onclick=close;$("bky").onclick=bkQuit}

 setTimeout(()=>{try{history.back()}catch(e){}bkHint(mgT("اضغط زر الرجوع مرة تانية للخروج","Press Back once more to exit"))},350)}
/* guard entry must be pushed from a real user gesture, otherwise Chrome skips it and Back leaves the app at once */
function bkPush(){try{history.pushState({g:1},"")}catch(e){}}
function bkGuard(){if(_bkTouch&&me&&!(history.state&&history.state.g)){bkPush();_bkExit=false;_bkN=0}}

 if(!_bkTouch||_bkExit||!me||(e.state&&e.state.g))return;
 const o=$("ov");
 if(o&&o.classList.contains("on")){bkPush();close();return}
 if(view!="home"){bkPush();view="home";render();return}
 /* Home: 1st Back -> hint, 2nd Back -> hint, 3rd Back -> really exits */
 clearTimeout(_bkT);_bkN++;
 if(_bkN==1){bkPush();bkHint(mgT("اضغط زر الرجوع مرتين كمان للخروج","Press Back 2 more times to exit"))}
 else if(_bkN==2){bkHint(mgT("اضغط زر الرجوع مرة كمان للخروج","Press Back once more to exit"))}
 _bkT=setTimeout(()=>{_bkN=0;bkGuard()},4000)});
