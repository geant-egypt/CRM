 $("lb").onclick=setLang;$("lo").onclick=()=>{me=null;try{sessionStorage.removeItem("g-me")}catch(e){}render()};
 r.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(navOpen&&!navPinned){navOpen=false;navAnim=true}render()});

// دالة فحص شرط الأربعاء الساعة 12 ظهراً
function canSubmitRequest() {
    const now = new Date();
    const day = now.getDay(); // 3 هو الأربعاء
    const hour = now.getHours();
    if (day === 3 && hour >= 12) return false;
    if (day > 3) return false;
    return true;
}

// واجهة تقديم الطلبات للشباب
function requestsView(a) {
    const allowed = canSubmitRequest();
    if(!S.requests) S.requests = [];
    const myReqs = S.requests.filter(r => r.user === me.u);

    a.innerHTML = `
        <div class="box">
            <h3>تقديم طلب جديد (إجازة، أوف، غير مدفوعة، شفت)</h3>
            ${!allowed ? '<div class="err" style="margin-bottom:10px;">عذراً، لا يمكنك إرسال طلبات جديدة بعد يوم الأربعاء الساعة 12:00 ظهراً.</div>' : ''}
            <div class="f">
                <label>نوع الطلب:
                    <select id="rType" ${!allowed?'disabled':''}>
                        <option value="Annual Leave">إجازة سنوية (Annual Leave)</option>
                        <option value="Off Day">يوم Off (طلب يوم راحة معين)</option>
                        <option value="Unpaid Leave">إجازة غير مدفوعة الأجر (Unpaid)</option>
                        <option value="Shift Request">طلب شفت معين</option>
                    </select>
                </label>
                <label>التاريخ المستهدف:
                    <input type="date" id="rDate" ${!allowed?'disabled':''}>
                </label>
                <label>اختيار الشفت (في حال طلب شفت):
                    <select id="rShift" ${!allowed?'disabled':''}>
                        <option value="">-- اختر الشفت (لو مطلوب) --</option>
                        <option value="08:00 AM - 05:00 PM">الشفت الأول (8 صباحاً إلى 5 عصراً)</option>
                        <option value="04:00 PM - 01:00 AM">الشفت الثاني (4 عصراً إلى 1 صباحاً)</option>
                    </select>
                </label>
                <label>ملاحظات إضافية / تفاصيل:
                    <textarea id="rNotes" rows="2" ${!allowed?'disabled':''}></textarea>
                </label>
                <button class="btn" id="subReq" ${!allowed?'disabled style="opacity:0.5;cursor:not-allowed;"':''}>إرسال الطلب</button>
            </div>
        </div>
        <div class="box">
            <h3>طلباتي السابقة</h3>
            <div class="scroll">
                <table>
                    <tr><th>النوع</th><th>التاريخ</th><th>الشفت</th><th>الحالة</th></tr>
                    ${myReqs.length ? myReqs.map(r=>`
                        <tr>
                            <td><b>${r.type}</b></td>
                            <td>${r.date}</td>
                            <td>${r.shift||'—'}</td>
                            <td><span class="tag ${r.status=='approved'?'done':r.status=='rejected'?'new':'mid'}">${r.status=='approved'?'موافق عليه':r.status=='rejected'?'مرفوض':'قيد المراجعة'}</span></td>
                        </tr>
                    `).join('') : '<tr><td colspan="4" class="empty">لا توجد طلبات سابقة</td></tr>'}
                </table>
            </div>
        </div>
    `;

    if(allowed) {
        $("subReq").onclick = () => {
            const type = $("rType").value;
            const date = $("rDate").value;
            const shift = $("rShift").value;
            const notes = $("rNotes").value.trim();
            if(!date) { alert("يرجى تحديد التاريخ!"); return; }

            S.requests.push({
                id: Date.now(),
                user: me.u,
                userName: nm(me.u),
                type, date, shift, notes,
                status: 'pending',
                time: Date.now()
            });
            save();
            alert("تم إرسال طلبك بنجاح!");
            render();
        };
    }
}

// واجهة الموافقات الخاصة بك (المشرف/المدير)
function approvalsView(a) {
    if(!S.requests) S.requests = [];
    const pending = S.requests.filter(r => r.status === 'pending');
    const history = S.requests.filter(r => r.status !== 'pending');

    a.innerHTML = `
        <div class="box">
            <h3>الطلبات المعلقة (تنتظر قرارك)</h3>
            <div class="scroll">
                <table>
                    <tr><th>الموظف</th><th>النوع</th><th>التاريخ</th><th>الشفت</th><th>ملاحظات</th><th>الإجراء</th></tr>
                    ${pending.length ? pending.map(r=>`
                        <tr>
                            <td><b>${esc(r.userName)}</b></td>
                            <td>${r.type}</td>
                            <td>${r.date}</td>
                            <td>${r.shift||'—'}</td>
                            <td>${esc(r.notes||'—')}</td>
                            <td>
                                <button class="btn gr s" onclick="changeReq(${r.id}, 'approved')">موافقة</button>
                                <button class="btn dl s" onclick="changeReq(${r.id}, 'rejected')">رفض</button>
                            </td>
                        </tr>
                    `).join('') : '<tr><td colspan="6" class="empty">لا توجد طلبات معلقة حالياً</td></tr>'}
                </table>
            </div>
        </div>
        <div class="box">
            <h3>سرشيف الطلبات السابقة</h3>
            <div class="scroll">
                <table>
                    <tr><th>الموظف</th><th>النوع</th><th>التاريخ</th><th>الحالة</th></tr>
                    ${history.length ? history.map(r=>`
                        <tr>
                            <td>${esc(r.userName)}</td>
                            <td>${r.type}</td>
                            <td>${r.date}</td>
                            <td><span class="tag ${r.status=='approved'?'done':'new'}">${r.status=='approved'?'موافق عليه':'مرفوض'}</span></td>
                        </tr>
                    `).join('') : '<tr><td colspan="4" class="empty">لا توجد طلبات مؤرشفة</td></tr>'}
                </table>
            </div>
        </div>
    `;
}

window.changeReq = function(id, st) {
    const r = S.requests.find(x => x.id === id);
    if(r) {
        r.status = st;
        save();
        render();
    }
};

function home(a) {
    a.innerHTML = `<div class="box"><h3>مرحباً بك يا ${nm(me.u)}</h3><p>استخدم القائمة بالأعلى التنقل بين التذاكر والطلبات.</p></div>`;
}
function dash(a) {
    a.innerHTML = `<div class="box"><h3>لوحة التحليلات العامة</h3></div>`;
}
function tks(a) {
    a.innerHTML = `<div class="box"><h3>قسم التذاكر</h3></div>`;
}
function cus(a) {
    a.innerHTML = `<div class="box"><h3>قائمة العملاء</h3></div>`;
}

document.addEventListener("DOMContentLoaded", () => {
    render();
});
</script>
